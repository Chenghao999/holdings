[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdings-cli"
version = "1.0.0"
description = "A CLI-first investment tracking tool, architected for future GUI/Web extensions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "holdings" }]
keywords = ["portfolio-cli", "quant", "python", "akshare", "yfinance"]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["akshare", "yfinance>=0.2.0"]
# 单独一档：chart 只需要 plotly。只装 [data] 的用户跑 holdings chart 不该缺依赖，
# 画一张净值曲线也不该顺带拖进整套数据源。
chart = ["plotly>=5.0.0"]
tui = ["textual>=0.50.0"]
# 这里曾声明 web / gui 两组（streamlit、fastapi、PySide6），但源码里零引用，
# `pip install 'holdings-cli[gui]'` 会装好 200MB 的 PySide6 却无界面可用。
# 已按 B-16 删除，现在 web 这一组随 B-20 的看板一起加回来；gui 仍无代码，
# 形态见 B-22，等真动手时再加。
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]
# textual 进 dev 是为了让 TUI 能被真正测到（headless 跑一遍界面），
# 而不是只测「缺依赖时报错」那一条路径。web 这一组同理：fastapi + jinja2
# 让看板能被 TestClient 真的跑一遍，httpx 是 TestClient 自己的依赖
# （跑起来会有 starlette 的 StarletteDeprecationWarning：它已在推 httpx2，
# 但仍支持 httpx；等它真删了再换，现在换等于把 dev 环境押在一个新名字上）。
# uvicorn 不进 dev——起真服务器的用例只会带来偶发的端口冲突，
# `holdings web` 那条命令用假模块测调用即可。
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.16.7,<0.17",
    "textual>=0.50.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
# 必须指向 main 而不是裸 click group cli：异常→退出码的映射写在 main() 里，
# 指向 cli 会让 ERROR_HANDLING.md 定义的退出码与「错误（N）：」前缀全部失效，
# 用户看到的只是裸 traceback 和恒定的退出码 1。
holdings = "holdings.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 模板是 web 层的代码，不是文档：漏掉这一条，`pip install 'holdings-cli[web]'`
# 装出来的包能 import、一请求就报「模板不存在」。这个错误只在装分发包时才出现，
# 源码目录里跑（pythonpath=src）永远复现不了。
holdings = ["web/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["holdings"]

[tool.coverage.report]
# 门槛比实测值低一档：当前是 95.5%（1594 条语句、漏 71 条），终端上显示的
# 96% 是四舍五入来的，照那个数卡会立刻红。留一档余量是为了让门槛拦住
# 「成片掉下去」，而不是被增删一行语句反复绊倒。
#
# 放在这里而不是 workflow 的命令行里：本地跑 `pytest --cov` 与 CI 用同一个数，
# 两处各写一个早晚会分叉。
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式声明规则集：ruff 的默认 select 会随版本变化，
# 不写死的话 CI 会因为依赖升级而突然变红。
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "PERF", # perflint
    "RUF",  # ruff 专有规则
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    # 记账场景下"今天"就该取用户本地日期，换成 UTC 反而会跨日错一天。
    "DTZ011",
    # 本项目注释与文档字符串使用中文，全角标点是正常书写而非同形异义字攻击。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["holdings"]