[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdings"
version = "0.1.0"
description = "A CLI-first investment tracking tool, architected for future GUI/Web extensions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "holdings" }]
keywords = ["portfolio-cli", "quant", "python", "akshare", "yfinance"]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["akshare", "yfinance>=0.2.0"]
tui = ["textual>=0.50.0"]
web = ["streamlit>=1.30.0", "fastapi>=0.100.0"]
gui = ["PySide6>=6.6.0", "plotly>=5.0.0"]
dev = ["pytest", "pytest-cov", "ruff>=0.16.7,<0.17", "responses"]

[project.scripts]
holdings = "holdings.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式声明规则集：ruff 的默认 select 会随版本变化，
# 不写死的话 CI 会因为依赖升级而突然变红。
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "PERF", # perflint
    "RUF",  # ruff 专有规则
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    # 记账场景下"今天"就该取用户本地日期，换成 UTC 反而会跨日错一天。
    "DTZ011",
    # 本项目注释与文档字符串使用中文，全角标点是正常书写而非同形异义字攻击。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["holdings"]